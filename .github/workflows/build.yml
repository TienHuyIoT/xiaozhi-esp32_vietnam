name: Build Boards

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: select
        name: Select variants based on changes
        shell: bash
        run: |
          # Ép buộc chỉ build duy nhất custom_robot để bỏ qua các bo mạch khác
          echo 'variants=[{"board": "custom_robot", "name": "custom_robot"}]' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.ci_name || matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build current variant
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.name }}
          BUILD_OPTIONS_JSON: ${{ toJSON(matrix.ci_build_options) }}
        run: |
          source "$IDF_PATH/export.sh"
          OPTIONS=()
          if [[ "$BUILD_OPTIONS_JSON" != "null" && -n "$BUILD_OPTIONS_JSON" ]]; then
            OPTIONS+=(--build-options-json "$BUILD_OPTIONS_JSON")
          fi
          python scripts/build.py "$BOARD" --name "$VARIANT" "${OPTIONS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_${{ matrix.ci_name || matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
